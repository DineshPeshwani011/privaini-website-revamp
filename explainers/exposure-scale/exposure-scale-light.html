<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exposure and remediation</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

// Pure model for the exposure scale (Fig 3). No imports, no DOM: the build and the page both run it.
// Source: Privaini's published sample report for your-company.com (risk HIGH, 19 jurisdictions, 10 findings).
// Ranges are in millions. The phasing is an illustrative plan for that sample report.

const ES_REPORT = { site: "your-company.com", risk: "HIGH", jurisdictions: 19, findings: 10, low: 18, high: 58 };

// GDPR's range is published in euros. It is counted at this rate (stated in the caption), which is the rate
// at which the four named ranges fit inside the report's $18M–$58M total.
const ES_EUR_TO_USD = 1;

const ES_NAMED = [
  { id: "vppa", law: "VPPA §2710", what: "Video tracking without consent", low: 8.9, high: 22.4, currency: "USD", phase: 1 },
  { id: "bipa", law: "BIPA", what: "Biometric capture without notice", low: 3.4, high: 14.2, currency: "USD", phase: 1 },
  { id: "gdpr", law: "GDPR Art.6", what: "Cross-border data transfer gap", low: 3.5, high: 12, currency: "EUR", phase: 2 },
  { id: "ccpa", law: "CCPA §1798", what: "Third-party pixel on health pages", low: 2.1, high: 8.4, currency: "USD", phase: 2 },
];

const esTenth = (value) => Math.round(value * 10) / 10;
const esUsd = (finding, value) => (finding.currency === "EUR" ? value * ES_EUR_TO_USD : value);

// The six other findings are one weight: whatever the report total leaves after the four named ranges.
const ES_OTHER = {
  id: "other",
  law: "6 other findings",
  what: "Remainder of the report total",
  count: 6,
  currency: "USD",
  phase: 3,
  low: esTenth(ES_REPORT.low - ES_NAMED.reduce((sum, f) => sum + esUsd(f, f.low), 0)),
  high: esTenth(ES_REPORT.high - ES_NAMED.reduce((sum, f) => sum + esUsd(f, f.high), 0)),
};

const ES_WEIGHTS = [...ES_NAMED, ES_OTHER].map((f) => {
  const low = esUsd(f, f.low);
  const high = esUsd(f, f.high);
  return { ...f, lowUsd: low, highUsd: high, mid: (low + high) / 2 };
});

const ES_PHASES = 3;
const ES_DIAL_MAX = 60;

// Which weights are still on the pan once `phase` (0..3) is complete.
const esOpenAt = (phase) => ES_WEIGHTS.map((w) => w.phase > phase);

// Sum of the findings still on the pan: low, high and the sum of midpoints (what the needle reads).
function esExposure(onPan) {
  let low = 0, high = 0, mid = 0;
  ES_WEIGHTS.forEach((w, i) => {
    if (!onPan[i]) return;
    low += w.lowUsd;
    high += w.highUsd;
    mid += w.mid;
  });
  return { low: esTenth(low), high: esTenth(high), mid: esTenth(mid) };
}

function esMoney(value) {
  const v = esTenth(value);
  if (v <= 0) return "$0";
  return v >= 10 && Number.isInteger(v) ? `$${v}M` : `$${v.toFixed(1)}M`;
}

function esRange({ low, high }) {
  return high <= 0 ? "$0" : `${esMoney(low)}–${esMoney(high)}`;
}

function esReadout(phase, exposure) {
  if (phase <= 0) return `phase 0 · exposure ${esRange(exposure)}`;
  return `phase ${phase} of ${ES_PHASES} · remaining ${esRange(exposure)}`;
}

// The idle tour: hold each phase, then turn back to the start.
const ES_TOUR = [0, 1, 2, 3, 3, 0];
const ES_TOUR_STEP = 2.6;

const P = {"origin":[265.77190966408006,257.1310805795028],"scale":1.205382109307836,"azimuth":22,"elevation":30};
const SPOTS = [[0,59.22287315801276],[0,25.01672720493353],[0,-12.84792429360983],[0,-41.623789003952474],[0,-69.98201066342187]];
const RADII = [16,13.206145953079227,12.658505545464134,11.11735916487851,5.240862494590887];
const PLAT_TOP = 26, PIN_SHARE = 0.4, LIFT = 12, PIN_REST = 3;
const BEZEL_X = -22.8, DIAL = [-113.22287315801276,87], TICK_R = 26, SWEEP = 4.71238898038469;
const KNOB_AT = [16,-113.22287315801276], KNOB_R = 7.5, KNOB_TOP = 16, DETENT0 = 0.8203047484373349, DETENT_STEP = 0.8726646259971648;
const at = (p) => iso(p, P);
function pinSvg(i, top) {
  const [x, y] = SPOTS[i];
  const r = RADII[i] * PIN_SHARE;
  const h = top - PLAT_TOP;
  if (h < 0.05) return "";
  return solidSvg(cylinder(x, y, r, PLAT_TOP, h, P, 24), { tone: "mid" });
}
const onFace = (u, v, x = BEZEL_X) => at([x, DIAL[0] - u, DIAL[1] + v]);
const angleOf = (value) => -SWEEP / 2 + (SWEEP * Math.min(ES_DIAL_MAX, Math.max(0, value))) / ES_DIAL_MAX;
const polar = (r, a) => [r * Math.sin(a), r * Math.cos(a)];
const faceArc = (r, a0, a1, steps) => Array.from({ length: steps + 1 }, (_, j) => onFace(...polar(r, a0 + ((a1 - a0) * j) / steps)));
const needleD = function needleD(value) {
  const a = angleOf(value);
  return pathOf([onFace(...polar(-6, a)), onFace(...polar(TICK_R, a))]);
};
const bandD = function bandD(low, high) {
  if (high - low < 0.05 && high < 0.05) return "";
  const a0 = angleOf(low), a1 = angleOf(Math.max(high, low + 0.15));
  const steps = Math.max(2, Math.ceil(((a1 - a0) / SWEEP) * 60));
  const outer = faceArc(TICK_R - 0.6, a0, a1, steps);
  const inner = faceArc(TICK_R - 4.2, a1, a0, steps);
  return pathOf([...outer, ...inner], true);
};
const pointerD = function pointerD(s) {
  const a = DETENT0 + DETENT_STEP * s;
  const [x, y] = KNOB_AT;
  const sx = Math.sin(a), sy = -Math.cos(a);
  return lineOnTop([x - sx * 2, y - sy * 2], [x + sx * (KNOB_R - 0.6), y + sy * (KNOB_R - 0.6)], KNOB_TOP, P);
};

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const live = document.querySelector("[data-live]");
const needle = svg.querySelector('[data-part="needle"]');
const band = svg.querySelector('[data-part="band"]');
const pointer = svg.querySelector('[data-part="pointer"]');
const weights = ES_WEIGHTS.map((_, i) => svg.querySelector('[data-weight="' + i + '"]'));
const pins = ES_WEIGHTS.map((_, i) => svg.querySelector('[data-pin="' + i + '"]'));
const halos = ES_WEIGHTS.map((_, i) => svg.querySelector('[data-halo="' + i + '"]'));
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const ease = (t) => t * t * (3 - 2 * t);

let target = 0, s = 0;
const gauge = { mid: { at: 0, rate: 0 }, low: { at: 0, rate: 0 }, high: { at: 0, rate: 0 } };
{ const e = esExposure(esOpenAt(0)); for (const key of ["mid", "low", "high"]) gauge[key].at = e[key]; }
let frame = 0, last = 0, clock = 0, touring = !still.matches, visible = false, idleTimer = 0, said = "";
const pinTop = (i, phase) => PLAT_TOP - PIN_REST + (PIN_REST + LIFT) * ease(clamp(phase - (ES_WEIGHTS[i].phase - 1), 0, 1));
const tourAt = (t) => ES_TOUR[Math.floor(t / ES_TOUR_STEP) % ES_TOUR.length];

function draw(onPan) {
  pointer.setAttribute("d", pointerD(s));
  ES_WEIGHTS.forEach((_, i) => {
    const top = pinTop(i, s);
    const lift = Math.max(0, top - PLAT_TOP);
    weights[i].setAttribute("transform", lift > 0.001 ? translateAlong(P, [0, 0, lift]) : "");
    if (onPan[i]) weights[i].removeAttribute("data-off"); else weights[i].setAttribute("data-off", "");
    const html = pinSvg(i, top);
    if (pins[i].__html !== html) { pins[i].innerHTML = html; pins[i].__html = html; }
    halos[i].style.opacity = (1 - Math.min(1, lift / LIFT) * 0.75).toFixed(3);
  });
  needle.setAttribute("d", needleD(gauge.mid.at));
  band.setAttribute("d", bandD(gauge.low.at, gauge.high.at));
  // the phase word and the range both come from which weights are on the pan right now
  let phase = 0;
  while (phase < ES_PHASES && ES_WEIGHTS.every((w, i) => w.phase > phase + 1 || !onPan[i])) phase++;
  const text = esReadout(phase, esExposure(onPan));
  if (readout.textContent !== text) readout.textContent = text;
}
function describe(phase) {
  const text = esReadout(phase, esExposure(esOpenAt(phase)));
  stage.setAttribute("aria-valuenow", String(phase));
  stage.setAttribute("aria-valuetext", text);
  return text;
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) { clock += dt; const next = tourAt(clock); if (next !== target) { target = next; describe(target); } }
  s = calm ? target : s + (target - s) * (1 - Math.exp(-dt / 0.45));
  if (Math.abs(target - s) < 0.002) s = target;
  const onPan = ES_WEIGHTS.map((_, i) => pinTop(i, s) <= PLAT_TOP + 1e-6);
  const want = esExposure(onPan);
  let resting = s === target;
  for (const key of ["mid", "low", "high"]) {
    const g = gauge[key];
    if (calm) { g.at = want[key]; g.rate = 0; continue; }
    const stiff = 70, drag = 9;
    for (let n = 0; n < 4; n++) { g.rate += ((want[key] - g.at) * stiff - g.rate * drag) * dt / 4; g.at += g.rate * dt / 4; }
    if (Math.abs(want[key] - g.at) < 0.005 && Math.abs(g.rate) < 0.005) { g.at = want[key]; g.rate = 0; }
    else resting = false;
  }
  draw(onPan);
  frame = visible && !(resting && !touring) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function steer(next) {
  touring = false;
  next = clamp(Math.round(next), 0, ES_PHASES);
  if (next !== target) { target = next; const text = describe(target); if (live) live.textContent = text; }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { touring = !still.matches; clock = target * ES_TOUR_STEP; run(); }, 3600);
  run();
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
// the stage's width is the plan, left to right: phase 0, 1, 2, 3
const phaseAtPointer = (event) => { const box = svg.getBoundingClientRect(); return clamp(Math.floor(((event.clientX - box.left) / box.width) * (ES_PHASES + 1)), 0, ES_PHASES); };
stage.addEventListener("pointermove", (event) => { if (event.pointerType === "mouse") steer(phaseAtPointer(event)); });
stage.addEventListener("pointerdown", (event) => steer(phaseAtPointer(event)));
stage.addEventListener("keydown", (event) => {
  const from = touring ? Math.round(s) : target;
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = from + 1;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = from - 1;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = ES_PHASES;
  if (/^[0-3]$/.test(event.key)) to = Number(event.key);
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
stage.addEventListener("focus", () => { steer(Math.round(s)); if (live && !live.textContent) live.textContent = describe(target); });
describe(0);
draw(esOpenAt(0));
</script><script>
(() => {
  if (window.parent === window) return;
  const id = "exposure-scale";
  const page = () => document.querySelector(".iso-page") || document.body;
  const post = () => window.parent.postMessage({ type: "privaini-explainer", id, height: Math.ceil(page().getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(page());
  addEventListener("load", post);
  post();
  addEventListener("wheel", (e) => {
    e.preventDefault();
    window.parent.postMessage({ type: "privaini-explainer-wheel", id, dx: e.deltaX, dy: e.deltaY, mode: e.deltaMode }, "*");
  }, { passive: false });
})();
</script></body></html>
